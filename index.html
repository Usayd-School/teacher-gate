<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة المعلم الرقمية - النسخة المطورة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>

:root{
    --bg:#eef2ff;
    --card:rgba(255,255,255,0.65);
    --primary:#4f46e5;
    --secondary:#8b5cf6;
    --dark:#1e293b;
    --muted:#64748b;
    --border:rgba(255,255,255,0.4);

    --shadow1:8px 8px 18px rgba(174,174,192,0.35);
    --shadow2:-8px -8px 18px rgba(255,255,255,0.95);

    --exc-bg:#dcfce7;
    --exc-txt:#15803d;

    --cre-bg:#ede9fe;
    --cre-txt:#7c3aed;

    --vg-bg:#dbeafe;
    --vg-txt:#2563eb;

    --fa-bg:#fef3c7;
    --fa-txt:#d97706;

    --we-bg:#fee2e2;
    --we-txt:#dc2626;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:linear-gradient(135deg,#eef2ff,#dbeafe,#ede9fe);
    min-height:100vh;
    color:var(--dark);
    overflow-x:hidden;
}

/* LOGIN */

#loginPage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#4f46e5,#8b5cf6);
    z-index:9999;
}

.login-card{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:35px;
    padding:45px;
    text-align:center;
    box-shadow:0 25px 50px rgba(0,0,0,0.25);
    color:white;
}

/* NAVBAR */

.navbar{
    margin:18px;
    padding:18px 30px;
    border-radius:30px;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(18px);
    border:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:var(--shadow1),var(--shadow2);
    position:sticky;
    top:10px;
    z-index:1000;
}

.logo-box{
    width:50px;
    height:50px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
}

/* CONTAINER */

.container{
    max-width:1600px;
    margin:auto;
    padding:10px 20px 40px;
}

/* STATS */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:30px;
}

.stat-card{
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(18px);
    border-radius:25px;
    padding:20px;
    border:1px solid var(--border);
    box-shadow:var(--shadow1),var(--shadow2);
    transition:0.3s;
    cursor:pointer;
}

.stat-card:hover{
    transform:translateY(-5px);
    background:rgba(255,255,255,0.8);
}

.stat-card h4{
    margin:0;
    color:var(--muted);
    font-size:12px;
}

.stat-card p{
    margin:10px 0 0;
    font-size:28px;
    font-weight:900;
    color:var(--primary);
}

/* CONTROL PANEL */

.control-panel{
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(18px);
    border-radius:30px;
    padding:25px;
    border:1px solid var(--border);
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:18px;
    align-items:end;
    box-shadow:var(--shadow1),var(--shadow2);
    margin-bottom:30px;
}

/* INPUTS */

.inp{
    width:100%;
    padding:12px;
    border:none;
    border-radius:15px;
    font-family:'Cairo';
    font-weight:700;
    background:rgba(255,255,255,0.75);
    outline:none;
    box-shadow:inset 2px 2px 5px rgba(0,0,0,0.05);
}

/* BUTTONS */

.btn-action{
    border:none;
    border-radius:15px;
    padding:12px 20px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
    font-weight:800;
    cursor:pointer;
    transition:0.3s;
    font-family:'Cairo';
}

.btn-action:hover{
    transform:translateY(-2px);
}

/* TABLE */

.table-card{
    overflow:auto;
    border-radius:30px;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(18px);
    border:1px solid var(--border);
    box-shadow:var(--shadow1),var(--shadow2);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

th{
    background:rgba(255,255,255,0.65);
    padding:15px;
    text-align:right;
    font-size:13px;
    color:var(--muted);
}

td{
    padding:15px;
    border-top:1px solid rgba(255,255,255,0.2);
}

/* LEVEL COLORS */

.lvl-exc{
    background:var(--exc-bg);
    color:var(--exc-txt);
}

.lvl-cre{
    background:var(--cre-bg);
    color:var(--cre-txt);
}

.lvl-vg{
    background:var(--vg-bg);
    color:var(--vg-txt);
}

.lvl-fa{
    background:var(--fa-bg);
    color:var(--fa-txt);
}

.lvl-we{
    background:var(--we-bg);
    color:var(--we-txt);
}

/* CHIPS */

.chips-container{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-bottom:8px;
}

.chip{
    padding:5px 10px;
    border-radius:10px;
    background:white;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    border:1px solid #ddd;
    transition:0.2s;
}

.chip:hover{
    background:#f0f0f0;
}

/* MESSAGE */

.msg-area{
    width:100%;
    min-height:60px;
    border-radius:15px;
    border:none;
    padding:10px;
    font-family:'Cairo';
    background:rgba(255,255,255,0.8);
}

/* BADGE */

.sent-badge{
    display:none;
    background:var(--exc-bg);
    color:var(--exc-txt);
    border-radius:12px;
    padding:8px;
    font-weight:900;
    text-align:center;
}

.row-dim{
    opacity:0.5;
    pointer-events:none;
}

/* POPUP */

#studentsPopup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:5000;
    display:none;
    align-items:center;
    justify-content:center;
}

.popup-content{
    width:90%;
    max-width:500px;
    background:white;
    border-radius:30px;
    padding:30px;
    max-height:80vh;
    overflow-y:auto;
}

/* NOTIFICATION */

#notification{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--primary);
    color:white;
    padding:12px 30px;
    border-radius:30px;
    font-weight:800;
    display:none;
    z-index:6000;
}

/* RESPONSIVE */

@media (max-width:1200px){

    .container{
        padding:10px;
    }

    .control-panel{
        grid-template-columns:repeat(2,1fr);
    }

    table{
        min-width:950px;
    }
}

@media (max-width:900px){

    .navbar{
        flex-direction:column;
        gap:15px;
        text-align:center;
        padding:20px;
    }

    .teacher-info{
        width:100%;
    }

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .control-panel{
        grid-template-columns:1fr;
    }

    .table-card{
        overflow-x:auto;
        border-radius:25px;
    }

    table{
        min-width:850px;
    }

    th, td{
        padding:12px;
        font-size:13px;
    }

    .btn-action{
        width:100%;
    }

    .popup-content{
        width:95%;
        padding:20px;
    }
}

@media (max-width:600px){

    body{
        font-size:14px;
    }

    .navbar{
        margin:10px;
        border-radius:20px;
    }

    .logo-box{
        width:42px;
        height:42px;
        font-size:18px;
    }

    .stats-grid{
        grid-template-columns:1fr;
        gap:12px;
    }

    .stat-card{
        padding:16px;
        border-radius:20px;
    }

    .stat-card p{
        font-size:24px;
    }

    .control-panel{
        padding:18px;
        border-radius:22px;
        gap:14px;
    }

    .inp{
        padding:11px;
        font-size:14px;
    }

    .btn-action{
        padding:12px;
        font-size:14px;
        border-radius:14px;
    }

    .chips-container{
        gap:4px;
    }

    .chip{
        font-size:10px;
        padding:5px 8px;
    }

    .msg-area{
        min-height:50px;
        font-size:13px;
    }

    .login-card{
        width:95%;
        padding:30px 20px;
        border-radius:25px;
    }

    .table-card{
        border-radius:20px;
    }

    table{
        min-width:780px;
    }

    th{
        font-size:11px;
    }

    td{
        font-size:12px;
    }

    #notification{
        width:90%;
        text-align:center;
        font-size:14px;
    }
}

/* EXTRA */

img{
    max-width:100%;
}

textarea{
    resize:vertical;
}

button{
    touch-action:manipulation;
}

.table-card::-webkit-scrollbar{
    height:8px;
}

.table-card::-webkit-scrollbar-thumb{
    background:#c7d2fe;
    border-radius:10px;
}

.table-card::-webkit-scrollbar-track{
    background:transparent;
}

</style>
</head>

<body>

<div id="loginPage">
    <div class="login-card">

        <div class="logo-box" style="margin:0 auto 20px">أ</div>

        <h2>بوابة المعلمين</h2>

        <input type="text" id="userInp" class="inp" placeholder="اسم المستخدم" style="margin-bottom:15px">

        <input type="password" id="passInp" class="inp" placeholder="كلمة المرور" style="margin-bottom:20px">

        <button class="btn-action" style="width:100%" onclick="checkAuth()">
            دخول للنظام
        </button>

        <p id="errorMsg" style="display:none;color:#fee2e2;margin-top:15px">
            بيانات الدخول غير صحيحة
        </p>

    </div>
</div>

<div id="notification">تم الحفظ بنجاح</div>

<div id="studentsPopup">

    <div class="popup-content">

        <h2 id="popupTitle">القائمة</h2>

        <div id="popupStudents"></div>

        <button class="btn-action" onclick="closePopup()" style="width:100%; margin-top:20px">
            إغلاق
        </button>

    </div>

</div>

<nav class="navbar">

    <div class="logo-section" style="display:flex; gap:15px; align-items:center;">

        <div class="logo-box">أ</div>

        <div>
            <h2 style="margin:0;font-size:18px">
                بوابة المعلم الرقمية
            </h2>
        </div>

    </div>

    <div class="teacher-info">

        <span id="displaySubj" style="display:block; font-size:12px; color:var(--muted)">
        </span>

        <strong id="displayTeacher"></strong>

    </div>

</nav>

<div class="container">

    <div class="stats-grid">

        <div class="stat-card">
            <h4>إجمالي الطلاب</h4>
            <p id="totalStds">0</p>
        </div>

        <div class="stat-card">
            <h4>رُصد اليوم</h4>
            <p id="totalSent">0</p>
        </div>

        <div class="stat-card" onclick="showStudentsList('exc')">
            <h4>المتميزون</h4>
            <p id="excCount">0</p>
        </div>

        <div class="stat-card" onclick="showStudentsList('we')">
            <h4>الطلاب الضعاف</h4>
            <p id="weakCount">0</p>
        </div>

        <div class="stat-card" onclick="showStudentsList('gold')">
            <h4>الميداليات الذهبية</h4>
            <p id="goldCount">0</p>
        </div>

        <div class="stat-card" onclick="showStudentsList('silver')">
            <h4>الميداليات الفضية</h4>
            <p id="silverCount">0</p>
        </div>

        <div class="stat-card" onclick="showStudentsList('bronze')">
            <h4>الميداليات البرونزية</h4>
            <p id="bronzeCount">0</p>
        </div>

        <div class="stat-card">
            <h4>آخر تسجيل دخول</h4>
            <p id="lastLogin" style="font-size:16px">-</p>
        </div>

    </div>

</div>

</body>
</html>
